<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lifelike</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #0d1117;
        --border: #1f2733;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4a9eff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: #05070d;
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header, footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      footer { border-bottom: none; border-top: 1px solid var(--border); }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 12px 0 0;
        letter-spacing: 0.02em;
      }
      h1 span { color: var(--muted); font-weight: 400; }
      button, select, input {
        font: inherit;
        color: var(--text);
        background: #161b22;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
      }
      button { cursor: pointer; }
      button:hover { border-color: #384250; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
      input[type="text"] { width: 116px; font-family: ui-monospace, SFMono-Regular, monospace; }
      input[type="range"] { width: 110px; padding: 0; background: none; border: none; }
      label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
      canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
      #board { position: relative; overflow: hidden; }
      .readout { font-family: ui-monospace, SFMono-Regular, monospace; color: var(--muted); }
      .readout b { color: var(--text); font-weight: 600; }
      .spacer { flex: 1; }
      .hint { color: var(--muted); font-size: 12px; }
      @media (max-width: 720px) { .hint { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1>lifelike <span>demo</span></h1>
      <button id="play" class="primary">Play</button>
      <button id="step">Step</button>
      <button id="back">Back</button>
      <label>Speed <input id="speed" type="range" min="1" max="60" value="15" /></label>
      <div class="spacer"></div>
      <button id="random">Random</button>
      <button id="clear">Clear</button>
      <button id="fit">Fit</button>
    </header>
    <div id="board"><canvas id="canvas"></canvas></div>
    <footer>
      <label>Pattern <select id="pattern"></select></label>
      <label>Rule <select id="named"></select></label>
      <input id="rule" type="text" value="B3/S23" spellcheck="false" />
      <label>Edges
        <select id="topology">
          <option value="torus">Torus</option>
          <option value="plane">Plane</option>
        </select>
      </label>
      <label>Theme <select id="theme"></select></label>
      <div class="spacer"></div>
      <span class="hint">drag to draw &middot; shift-drag to pan &middot; wheel to zoom</span>
      <span class="readout">gen <b id="generation">0</b> &middot; pop <b id="population">0</b></span>
      <button id="copy">Copy RLE</button>
    </footer>
    <script src="./demo.js"></script>
  </body>
</html>
