name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A new push to a pull request supersedes the run already in flight, and
  # nothing downstream waits on the older one. Push events are exempt: a push
  # run is the record that a given commit passed, so it always finishes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
